---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: backrest-userdata
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 200Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  nfs:
    path: /mnt/tank/backups
    server: scale.lan
  persistentVolumeReclaimPolicy: Retain
