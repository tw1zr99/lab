---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: filebrowser-quantum-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  nfs:
    path: /mnt/tank/quantum
    server: scale.lan
  persistentVolumeReclaimPolicy: Retain
