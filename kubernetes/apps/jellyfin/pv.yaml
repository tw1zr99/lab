---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-movies
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  nfs:
    path: /mnt/tank/media/movies
    server: "${STORAGE_HOST}"
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - vers=4.1
---
