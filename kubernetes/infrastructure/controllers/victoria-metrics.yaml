---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: victoria-metrics
  namespace: flux-system
spec:
  url: https://victoriametrics.github.io/helm-charts/
  interval: 24h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-single
      version: "${VICTORIA_METRICS_SINGLE_CHART_VERSION}"
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  values:
    serviceAccount:
      name: victoria-metrics
    server:
      fullnameOverride: victoria-metrics-server
      retentionPeriod: 7d
      persistentVolume:
        enabled: true
        storageClassName: longhorn
        size: 5Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      podSecurityContext:
        enabled: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        enabled: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
      service:
        labels:
          headlamp-prometheus: "true"
      scrape:
        enabled: true
        config:
          global:
            scrape_interval: 60s
            scrape_timeout: 15s
          scrape_configs:
            - job_name: victoria-metrics
              static_configs:
                - targets:
                    - localhost:8428
            - job_name: kubernetes-apiservers
              kubernetes_sd_configs:
                - role: endpoints
              scheme: https
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              relabel_configs:
                - source_labels:
                    - __meta_kubernetes_namespace
                    - __meta_kubernetes_service_name
                    - __meta_kubernetes_endpoint_port_name
                  action: keep
                  regex: default;kubernetes;https
              metric_relabel_configs:
                - source_labels:
                    - __name__
                  action: keep
                  regex: apiserver_request_total|apiserver_request_duration_seconds_bucket|process_cpu_seconds_total|process_resident_memory_bytes|up
            - job_name: kubernetes-nodes
              kubernetes_sd_configs:
                - role: node
              scheme: https
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              relabel_configs:
                - source_labels:
                    - __meta_kubernetes_node_name
                  target_label: node
                - source_labels:
                    - __meta_kubernetes_node_name
                  target_label: __metrics_path__
                  replacement: /api/v1/nodes/$1/proxy/metrics
                - target_label: __address__
                  replacement: kubernetes.default.svc:443
              metric_relabel_configs:
                - source_labels:
                    - __name__
                  action: keep
                  regex: kubelet_volume_stats_(used|capacity)_bytes|process_cpu_seconds_total|process_resident_memory_bytes|up
            - job_name: kubernetes-nodes-cadvisor
              kubernetes_sd_configs:
                - role: node
              scheme: https
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              honor_timestamps: false
              relabel_configs:
                - source_labels:
                    - __meta_kubernetes_node_name
                  target_label: node
                - source_labels:
                    - __meta_kubernetes_node_name
                  target_label: __metrics_path__
                  replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
                - target_label: __address__
                  replacement: kubernetes.default.svc:443
              metric_relabel_configs:
                - source_labels:
                    - __name__
                  action: keep
                  regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_network_receive_bytes_total|container_network_transmit_bytes_total|container_fs_reads_bytes_total|container_fs_writes_bytes_total
                - action: labeldrop
                  regex: id|image
            - job_name: kubernetes-pods
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels:
                    - __meta_kubernetes_pod_container_init
                  action: drop
                  regex: "true"
                - source_labels:
                    - __meta_kubernetes_pod_annotation_prometheus_io_scrape
                  action: keep
                  regex: "true"
                - source_labels:
                    - __meta_kubernetes_pod_annotation_prometheus_io_scheme
                  action: replace
                  target_label: __scheme__
                  regex: (https?)
                - source_labels:
                    - __meta_kubernetes_pod_annotation_prometheus_io_path
                  action: replace
                  target_label: __metrics_path__
                  regex: (.+)
                - source_labels:
                    - __address__
                    - __meta_kubernetes_pod_annotation_prometheus_io_port
                  action: replace
                  target_label: __address__
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $1:$2
                - source_labels:
                    - __meta_kubernetes_namespace
                  target_label: namespace
                - source_labels:
                    - __meta_kubernetes_pod_name
                  target_label: pod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoria-metrics-node-proxy
rules:
  - apiGroups:
      - ""
    resources:
      - nodes/proxy
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoria-metrics-node-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: victoria-metrics-node-proxy
subjects:
  - kind: ServiceAccount
    name: victoria-metrics
    namespace: monitoring
