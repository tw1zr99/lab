---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.tpl.yml: |
    server:
      address: 0.0.0.0:9091

    log:
      level: debug

    identity_validation:
      reset_password:
        jwt_secret: $${JWT_SECRET}

    authentication_backend:
      password_reset:
        disable: true
      file:
        path: /secrets/users.yml
        password:
          algorithm: argon2id
          iterations: 1
          salt_length: 16
          parallelism: 8
          memory: 64

    access_control:
      default_policy: one_factor
      rules:
        - domain:
            - "${CLUSTER_DOMAIN}"
          resources:
            - "^/services"
          policy: one_factor
        - domain:
            - "${CLUSTER_DOMAIN}"
            - "links.${CLUSTER_DOMAIN}"
            - "login.${CLUSTER_DOMAIN}"
            - "tv.${CLUSTER_DOMAIN}"
            - "quantum.${CLUSTER_DOMAIN}"
          policy: bypass
        - domain:
            - "*"
          policy: one_factor
        - domain:
            - "adguard.${CLUSTER_DOMAIN}"
            - "adguard2.${CLUSTER_DOMAIN}"
            - "dl.${CLUSTER_DOMAIN}"
            - "files.${CLUSTER_DOMAIN}"
            - "grafana.${CLUSTER_DOMAIN}"
            - "openwrt.${CLUSTER_DOMAIN}"
            - "pinchflat.${CLUSTER_DOMAIN}"
            - "prowlarr.${CLUSTER_DOMAIN}"
            - "pve.${CLUSTER_DOMAIN}"
            - "pve2.${CLUSTER_DOMAIN}"
            - "radarr.${CLUSTER_DOMAIN}"
            - "shell.${CLUSTER_DOMAIN}"
            - "sonarr.${CLUSTER_DOMAIN}"
            - "traefik.${CLUSTER_DOMAIN}"
            - "truenas.${CLUSTER_DOMAIN}"
            - "vpn.${CLUSTER_DOMAIN}"
          subject:
            - "group:users"
          policy: deny

    session:
      name: authelia_session
      same_site: lax
      secret: $${SESSION_SECRET}
      expiration: 8h
      inactivity: 8h
      cookies:
        - domain: "${CLUSTER_DOMAIN}"
          authelia_url: "https://login.${CLUSTER_DOMAIN}"
          default_redirection_url: "https://${CLUSTER_DOMAIN}"

    regulation:
      max_retries: 5
      find_time: 2m
      ban_time: 10m

    theme: dark

    storage:
      encryption_key: $${ENCRYPTION_KEY}
      local:
        path: /config/db.sqlite3

    notifier:
      filesystem:
        filename: /config/notification.txt

    identity_providers:
      oidc:
        claims_policies:
          legacy:
            id_token:
              - email
              - email_verified
              - name
              - preferred_username
              - groups
        hmac_secret: $${HMAC_SECRET}
        issuer_private_key: |
          $${ISSUER_PRIVATE_KEY}
        clients:
          - client_id: jellyfin
            client_name: Jellyfin
            client_secret: $${JELLYFIN_CLIENT_SECRET}
            public: false
            authorization_policy: one_factor
            require_pkce: true
            pkce_challenge_method: S256
            redirect_uris:
              - https://tv.${CLUSTER_DOMAIN}/sso/OID/redirect/authelia
            scopes:
              - openid
              - profile
              - groups
            consent_mode: implicit
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: client_secret_post

          - client_id: karakeep
            client_name: Karakeep
            client_secret: $${KARAKEEP_CLIENT_SECRET}
            public: false
            authorization_policy: one_factor
            require_pkce: false
            pkce_challenge_method: ''
            redirect_uris:
              - 'https://links.${CLUSTER_DOMAIN}/api/auth/callback/custom'
            scopes:
              - 'openid'
              - 'email'
              - 'profile'
            response_types:
              - 'code'
            grant_types:
              - 'authorization_code'
            claims_policy: 'legacy'
            consent_mode: implicit
            access_token_signed_response_alg: 'none'
            userinfo_signed_response_alg: 'none'
            token_endpoint_auth_method: 'client_secret_basic'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: authelia
  labels:
    app: authelia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      enableServiceLinks: false
      containers:
      - name: authelia
        image: authelia/authelia:latest
        # securityContext:
        #   runAsNonRoot: false
        #   # runAsUser: 1000
        #   readOnlyRootFilesystem: true
        # resources:
        #   requests:
        #     cpu:    "100m"
        #     memory: "128Mi"
        #   limits:
        #     cpu:    "250m"
        #     memory: "256Mi"
        ports:
        - containerPort: 9091
        volumeMounts:
          - name: config
            mountPath: /config
          - name: secret-volume
            mountPath: /secrets
            readOnly: true
        env:
          - name: TZ
            value: "Europe/London"
      initContainers:
      - name: init-config
        image: debian:latest
        securityContext:
          runAsNonRoot: false
          # runAsUser: 1000
          readOnlyRootFilesystem: false
        resources:
          requests:
            cpu:    "100m"
            memory: "128Mi"
          limits:
            cpu:    "250m"
            memory: "256Mi"
        command:
          - sh
          - -c
          - |
              apt-get update && apt-get install -y gettext-base && \
              envsubst < /config-template/configuration.tpl.yml > /config/configuration.yml && \
              echo $?
              echo "Rendered configuration:" && cat /config/configuration.yml && \
              sleep 5
        env:
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: authelia
                key: JWT_SECRET
          - name: SESSION_SECRET
            valueFrom:
              secretKeyRef:
                name: authelia
                key: SESSION_SECRET
          - name: ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: authelia
                key: ENCRYPTION_KEY
          - name: HMAC_SECRET
            valueFrom:
              secretKeyRef:
                name: authelia
                key: HMAC_SECRET
          - name: ISSUER_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: authelia
                key: ISSUER_PRIVATE_KEY
          - name: JELLYFIN_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: authelia
                key: JELLYFIN_CLIENT_SECRET
          - name: KARAKEEP_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: authelia
                key: KARAKEEP_CLIENT_SECRET
        volumeMounts:
          - name: config-template
            mountPath: /config-template
          - name: config
            mountPath: /config
      volumes:
      - name: config-template
        configMap:
          name: authelia-config
          items:
            - key: configuration.tpl.yml
              path: configuration.tpl.yml
      - name: config
        emptyDir: {}
      - name: secret-volume
        secret:
          secretName: authelia
