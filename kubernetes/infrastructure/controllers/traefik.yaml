---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  url: https://helm.traefik.io/traefik
  interval: 24h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: traefik
      version: "${TRAEFIK_CHART_VERSION}"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    global:
      checkNewVersion: false
      sendAnonymousUsage: false
    additionalArguments:
      - "--serversTransport.insecureSkipVerify=true"
    deployment:
      replicas: 3
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        http:
          tls:
            enabled: true
        http3:
          enabled: true
          advertisedPort: 4443
    providers:
      kubernetesCRD:
        enabled: true
        ingressClass: traefik-external
        allowExternalNameServices: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        allowExternalNameServices: true
        publishedService:
          enabled: false
    service:
      type: LoadBalancer
      loadBalancerIP: "${INGRESS_ADDRESS}"
      annotations:
        metallb.io/address-pool: ingress
    rbac:
      enabled: true
