---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: flux-system
spec:
  url: https://kubernetes-sigs.github.io/headlamp/
  interval: 24h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: headlamp
      version: "${HEADLAMP_CHART_VERSION}"
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  values:
    config:
      unsafeUseServiceAccountToken: true
      staticPlugins:
        enabled: true
      oidc:
        secret:
          create: false
    serviceAccount:
      name: headlamp
    clusterRoleBinding:
      clusterRoleName: view
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      privileged: false
      readOnlyRootFilesystem: true
      runAsGroup: 101
      runAsNonRoot: true
      runAsUser: 100
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headlamp-victoria-metrics-proxy
  namespace: monitoring
rules:
  - apiGroups:
      - ""
    resources:
      - services/proxy
    resourceNames:
      - victoria-metrics-server
      - victoria-metrics-server:8428
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headlamp-victoria-metrics-proxy
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headlamp-victoria-metrics-proxy
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-cluster-readonly
rules:
  # Core cluster-scoped resources not covered by the default view role.
  - apiGroups:
      - ""
    resources:
      - nodes
      - persistentvolumes
    verbs:
      - get
      - list
      - watch
  # Cluster-scoped types backing Headlamp's Network, Configuration, and
  # Security pages that the default view role excludes.
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apiregistration.k8s.io
    resources:
      - apiservices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingressclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - node.k8s.io
    resources:
      - runtimeclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
      - clusterroles
      - rolebindings
      - roles
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - scheduling.k8s.io
    resources:
      - priorityclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
      - volumeattachments
      - volumeattributesclasses
    verbs:
      - get
      - list
      - watch
  # Custom resource instances for the CRD groups installed in this cluster,
  # backing Headlamp's Custom Resources and Gateway pages.
  - apiGroups:
      - gateway.networking.k8s.io
      - groupsnapshot.storage.k8s.io
      - helm.toolkit.fluxcd.io
      - hub.traefik.io
      - image.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - longhorn.io
      - metallb.io
      - monitoring.coreos.com
      - notification.toolkit.fluxcd.io
      - snapshot.storage.k8s.io
      - source.extensions.fluxcd.io
      - source.toolkit.fluxcd.io
      - traefik.io
      - volsync.backube
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-cluster-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-cluster-readonly
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: monitoring
