---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: flux-system
spec:
  url: https://charts.longhorn.io
  interval: 24h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: v1.9.0
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    persistence:
      defaultClassReplicaCount: 2
      defaultDataLocality: best-effort
    defaultSettings:
      defaultReplicaCount: "2"
      defaultDataLocality: best-effort
      autoSalvage: "true"
    defaultBackupStore:
      backupTarget: "nfs://${STORAGE_HOST}:/mnt/tank/backups/appdata"
