---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backups
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 20m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/backups
  postBuild:
    substitute:
      CATALOG_VERSION: "8"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
      - kind: Secret
        name: volsync-credentials
  prune: true
  wait: true
  dependsOn:
    - name: backup-credentials
      readyExpr: >-
        dep.spec.postBuild.substitute['CATALOG_VERSION'] ==
        self.spec.postBuild.substitute['CATALOG_VERSION'] &&
        dep.status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True') &&
        dep.metadata.generation == dep.status.observedGeneration
    - name: apps
