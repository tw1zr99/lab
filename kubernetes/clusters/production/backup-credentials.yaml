---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup-credentials
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/backup-credentials
  postBuild:
    substitute:
      CATALOG_VERSION: "8"
  prune: true
  wait: true
