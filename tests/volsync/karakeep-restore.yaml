---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep-data-restore-test
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: karakeep-data-restore-test
  namespace: default
spec:
  trigger:
    manual: restore-test-1
  restic:
    repository: volsync-karakeep-data
    destinationPVC: karakeep-data-restore-test
    copyMethod: Direct
    cacheStorageClassName: longhorn
    cleanupCachePVC: true
    enableFileDeletion: true
    moverResources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
