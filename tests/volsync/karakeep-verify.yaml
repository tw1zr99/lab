---
apiVersion: v1
kind: Pod
metadata:
  name: karakeep-data-restore-test
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: verify
      image: busybox:1.38.0
      command:
        - sh
        - -c
        - test -s /data/db.db && test -s /data/queue.db && sleep 3600
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
      volumeMounts:
        - name: restored-data
          mountPath: /data
          readOnly: true
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: restored-data
      persistentVolumeClaim:
        claimName: karakeep-data-restore-test
