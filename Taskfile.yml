---
# go-task (https://taskfile.dev) entrypoint for building the cluster from scratch.
#   task terraform:plan -> validate and create a saved Proxmox plan
#   task bootstrap      -> Talos cluster + Flux GitOps, end to end
version: "3"

vars:
  CONFIG_FILE: "{{.ROOT_DIR}}/config/cluster.yaml"
  CLUSTER_VARS_FILE: "{{.ROOT_DIR}}/kubernetes/clusters/production/cluster-vars.yaml"
  TERRAFORM_DIR: "{{.ROOT_DIR}}/terraform"
  TALOS_DIR: "{{.ROOT_DIR}}/talos"
  TALHELPER_ENV_FILE: "{{.ROOT_DIR}}/config/cluster.yaml"
  FLUX_PATH:
    sh: yq -r '.GIT_PATH' {{.CONFIG_FILE}}
  GIT_URL:
    sh: yq -r '.GIT_URL' {{.CONFIG_FILE}}
  GIT_BRANCH:
    sh: yq -r '.GIT_BRANCH' {{.CONFIG_FILE}}
  CLUSTER_DOMAIN:
    sh: yq -r '.CLUSTER_DOMAIN' {{.CONFIG_FILE}}
  INGRESS_ADDRESS:
    sh: yq -r '.INGRESS_ADDRESS' {{.CONFIG_FILE}}
  BOOTSTRAP_TIMEOUT: '{{default "20m" .BOOTSTRAP_TIMEOUT}}'

env:
  KUBECONFIG: "{{.ROOT_DIR}}/kubeconfig"
  TALOSCONFIG: "{{.TALOS_DIR}}/clusterconfig/talosconfig"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  bootstrap:
    desc: "Configure provisioned Talos VMs and converge the cluster with Flux"
    cmds:
      - task: preflight
      - task: talos:bootstrap
      - task: flux:bootstrap
      - task: flux:wait
      - task: cluster:verify

  preflight:
    desc: "Check workstation tools, credentials, and encrypted Talos secrets"
    preconditions:
      - sh: test -n "$SOPS_AGE_KEY"
        msg: "SOPS_AGE_KEY must be set (configure it in .envrc)"
      - sh: test -n "$FLUX_SSH_KEY_PATH"
        msg: "FLUX_SSH_KEY_PATH must be set (configure it in .envrc)"
      - sh: test -f "$FLUX_SSH_KEY_PATH"
        msg: "FLUX_SSH_KEY_PATH does not reference a file"
      - sh: case "$(yq --version 2>/dev/null)" in *mikefarah*yq*version*v4.*) exit 0 ;; *) exit 1 ;; esac
        msg: "mikefarah/yq v4 must be installed"
    cmds:
      - |
        for command in terraform talosctl talhelper sops age kubectl flux task git curl yq; do
          command -v "$command" >/dev/null || {
            echo "Missing required command: $command" >&2
            exit 1
          }
        done
      - task: config:check
      - |
        if [ -f {{.TALOS_DIR}}/talsecret.sops.yaml ]; then
          sops --decrypt {{.TALOS_DIR}}/talsecret.sops.yaml >/dev/null
        fi

  validate:
    desc: "Validate Terraform, Talos, and Kubernetes configuration"
    cmds:
      - task: config:check
      - task: terraform:validate
      - task: talos:validate
      - task: kubernetes:validate

  # --- Cluster configuration -------------------------------------------------
  config:render:
    desc: "Render the Flux ConfigMap from config/cluster.yaml"
    cmds:
      - |
        yq eval '{
          "apiVersion": "v1",
          "kind": "ConfigMap",
          "metadata": {
            "name": "cluster-vars",
            "namespace": "flux-system"
          },
          "data": .
        }' {{.CONFIG_FILE}} > {{.CLUSTER_VARS_FILE}}

  config:check:
    desc: "Verify generated configuration matches config/cluster.yaml"
    cmds:
      - |
        yq eval '{
          "apiVersion": "v1",
          "kind": "ConfigMap",
          "metadata": {
            "name": "cluster-vars",
            "namespace": "flux-system"
          },
          "data": .
        }' {{.CONFIG_FILE}} | diff -u {{.CLUSTER_VARS_FILE}} -

  # --- Terraform -------------------------------------------------------------
  terraform:init:
    desc: "Initialize Terraform providers"
    dir: "{{.TERRAFORM_DIR}}"
    preconditions:
      - sh: test -n "$PROXMOX_VE_API_TOKEN"
        msg: "PROXMOX_VE_API_TOKEN must be set (configure it in .envrc)"
    cmds:
      - terraform init

  terraform:validate:
    desc: "Check Terraform formatting and validate the Proxmox configuration"
    dir: "{{.TERRAFORM_DIR}}"
    deps: [terraform:init]
    cmds:
      - terraform fmt -check -recursive
      - terraform validate

  terraform:plan:
    desc: "Create and display a saved Proxmox plan at terraform/tfplan"
    dir: "{{.TERRAFORM_DIR}}"
    deps: [terraform:validate]
    cmds:
      - terraform plan -out=tfplan
      - terraform show tfplan

  # --- Talos -----------------------------------------------------------------
  talos:validate:
    desc: "Validate the declarative Talhelper configuration"
    dir: "{{.TALOS_DIR}}"
    deps: [config:check]
    cmds:
      - talhelper validate talconfig --env-file {{.TALHELPER_ENV_FILE}}

  talos:secret:
    desc: "Generate Talos secrets once, SOPS-encrypted (run before first genconfig)"
    dir: "{{.TALOS_DIR}}"
    preconditions:
      - sh: test -n "$SOPS_AGE_KEY"
        msg: "SOPS_AGE_KEY must be set (configure it in .envrc)"
    cmds:
      - |
        plaintext="$(mktemp --suffix=.yaml)"
        encrypted="$(mktemp --suffix=.yaml)"
        trap 'rm -f "$plaintext" "$encrypted"' EXIT
        talhelper gensecret > "$plaintext"
        sops --encrypt \
          --filename-override talos/talsecret.sops.yaml \
          "$plaintext" > "$encrypted"
        mv "$encrypted" talsecret.sops.yaml
    status:
      - test -f {{.TALOS_DIR}}/talsecret.sops.yaml

  talos:genconfig:
    desc: "Render machine configs from talconfig.yaml into clusterconfig/"
    dir: "{{.TALOS_DIR}}"
    deps: [talos:secret, talos:validate]
    cmds:
      - talhelper genconfig --env-file {{.TALHELPER_ENV_FILE}}

  talos:disks:
    desc: "List disks on every maintenance-mode Talos VM before installation"
    cmds:
      - |
        for node in $(yq -r '.NODE_1_ADDRESS, .NODE_2_ADDRESS, .NODE_3_ADDRESS' {{.CONFIG_FILE}}); do
          talosctl --nodes "$node" get disks --insecure
        done

  talos:apply:
    desc: "Apply machine config to all nodes (INSECURE=--insecure on first boot)"
    dir: "{{.TALOS_DIR}}"
    deps: [talos:genconfig]
    cmds:
      - talhelper gencommand apply --env-file {{.TALHELPER_ENV_FILE}} --extra-flags "{{.INSECURE}}" | bash

  talos:kubeconfig:
    desc: "Refresh the repository-local kubeconfig from Talos configuration"
    dir: "{{.TALOS_DIR}}"
    deps: [talos:genconfig]
    cmds:
      - talhelper gencommand kubeconfig --env-file {{.TALHELPER_ENV_FILE}} --extra-flags "{{.ROOT_DIR}} --force" | bash

  talos:bootstrap:
    desc: "First-time bring-up: apply configs, bootstrap etcd, fetch kubeconfig"
    dir: "{{.TALOS_DIR}}"
    cmds:
      - task: talos:apply
        vars: { INSECURE: "--insecure" }
      # Installation reboots each node before etcd becomes bootstrap-ready.
      - |
        for attempt in $(seq 1 30); do
          if talhelper gencommand bootstrap --env-file {{.TALHELPER_ENV_FILE}} | bash; then
            break
          fi
          if [ "$attempt" -eq 30 ]; then
            echo "Talos did not become bootstrap-ready within 5 minutes" >&2
            exit 1
          fi
          sleep 10
        done
      - task: talos:kubeconfig
      - talhelper gencommand health --env-file {{.TALHELPER_ENV_FILE}} | bash

  # --- Flux ------------------------------------------------------------------
  flux:secret:
    desc: "Create the sops-age secret Flux uses to decrypt manifests"
    preconditions:
      - sh: test -n "$SOPS_AGE_KEY"
        msg: "SOPS_AGE_KEY must be set (configure it in .envrc)"
    cmds:
      - |
        kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply -f -
        printf '%s\n' "$SOPS_AGE_KEY" |
          kubectl create secret generic sops-age \
            --namespace=flux-system --from-file=age.agekey=/dev/stdin \
            --dry-run=client -o yaml | kubectl apply -f -

  flux:bootstrap:
    desc: "Install Flux and point it at this repo"
    deps: [flux:secret]
    preconditions:
      - sh: test -n "$FLUX_SSH_KEY_PATH"
        msg: "FLUX_SSH_KEY_PATH must be set (configure it in .envrc)"
      - sh: test -f "$FLUX_SSH_KEY_PATH"
        msg: "FLUX_SSH_KEY_PATH does not reference a file"
    cmds:
      - flux bootstrap git
          --url={{.GIT_URL}}
          --branch={{.GIT_BRANCH}}
          --path={{.FLUX_PATH}}
          --private-key-file="$FLUX_SSH_KEY_PATH"

  flux:wait:
    desc: "Reconcile Git and wait for every Flux Kustomization to become ready"
    cmds:
      - flux reconcile source git flux-system
      - kubectl wait kustomizations.kustomize.toolkit.fluxcd.io
          --all --namespace=flux-system
          --for=condition=ready --timeout={{.BOOTSTRAP_TIMEOUT}}

  # --- Kubernetes ------------------------------------------------------------
  kubernetes:validate:
    desc: "Render every current Kubernetes Kustomize root"
    cmds:
      - task: config:check
      - kubectl kustomize kubernetes/infrastructure/controllers >/dev/null
      - kubectl kustomize kubernetes/infrastructure/configs >/dev/null
      - kubectl kustomize kubernetes/apps >/dev/null

  cluster:verify:
    desc: "Verify Talos, Kubernetes, Flux, storage, MetalLB, and HTTPS"
    dir: "{{.TALOS_DIR}}"
    cmds:
      - talhelper gencommand health --env-file {{.TALHELPER_ENV_FILE}} | bash
      - |
        for attempt in $(seq 1 60); do
          if kubectl get --raw=/readyz >/dev/null 2>&1; then
            break
          fi
          if [ "$attempt" -eq 60 ]; then
            echo "Kubernetes API did not become ready within 5 minutes" >&2
            exit 1
          fi
          sleep 5
        done
      - kubectl wait nodes --all --for=condition=ready --timeout={{.BOOTSTRAP_TIMEOUT}}
      - kubectl wait kustomizations.kustomize.toolkit.fluxcd.io
          --all --all-namespaces
          --for=condition=ready --timeout={{.BOOTSTRAP_TIMEOUT}}
      - kubectl wait helmreleases.helm.toolkit.fluxcd.io
          --all --all-namespaces
          --for=condition=ready --timeout={{.BOOTSTRAP_TIMEOUT}}
      - kubectl wait certificates.cert-manager.io
          --all --all-namespaces
          --for=condition=ready --timeout={{.BOOTSTRAP_TIMEOUT}}
      - flux get kustomizations --all-namespaces
      - flux get helmreleases --all-namespaces
      - kubectl wait pvc --all --all-namespaces
          --for=jsonpath='{.status.phase}'=Bound --timeout={{.BOOTSTRAP_TIMEOUT}}
      - kubectl get pvc --all-namespaces
      - |
        if [ -z "$(kubectl get servicel2statuses.metallb.io --all-namespaces -o name)" ]; then
          echo "MetalLB has not assigned an L2 announcer" >&2
          exit 1
        fi
        kubectl get servicel2statuses.metallb.io --all-namespaces
      - |
        for attempt in $(seq 1 120); do
          if curl --fail --silent --show-error --head \
            --resolve {{.CLUSTER_DOMAIN}}:443:{{.INGRESS_ADDRESS}} \
            https://{{.CLUSTER_DOMAIN}} >/dev/null; then
            break
          fi
          if [ "$attempt" -eq 120 ]; then
            echo "HTTPS ingress did not become ready within 10 minutes" >&2
            exit 1
          fi
          sleep 5
        done
